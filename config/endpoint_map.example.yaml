# =====================================================================
# LOT Bot - Mapa de endpoints de Wallapop
# ---------------------------------------------------------------------
# IMPORTANTE
#
# Este fichero esta INTENCIONADAMENTE VACIO.
#
# LOT Bot no incluye ninguna URL de Wallapop escrita en el programa porque
# NO se inventan endpoints. Las rutas, metodos, parametros y el mapeo de la
# respuesta deben copiarse EXCLUSIVAMENTE de la documentacion oficial que
# Wallapop entrega junto a las credenciales de la integracion autorizada.
#
# COMO USARLO
#   1. Copia este fichero:      config/endpoint_map.example.yaml
#                          ->   config/endpoint_map.local.yaml
#      (el `.local.yaml` esta en .gitignore y nunca se sube al repositorio)
#   2. Rellena `api.base_url`, el bloque `oauth` y SOLO las operaciones que
#      la documentacion oficial te conceda.
#   3. Apunta la variable de entorno al fichero:
#      WALLAPOP_ENDPOINT_MAP=C:\ruta\a\endpoint_map.local.yaml
#   4. Pon LOT_BOT_DEMO_MODE=false
#
# REGLA: una operacion que quede comentada o vacia NO existe para LOT Bot.
# La aplicacion respondera NOT_AVAILABLE_WITH_CURRENT_API en lugar de
# simular que la ha ejecutado.
# =====================================================================

api:
  # URL base de la API autorizada, exactamente como aparezca en la documentacion.
  base_url: ""
  auth_header: "Authorization"
  auth_scheme: "Bearer"
  timeout_seconds: 30
  default_headers: {}
    # Accept: "application/json"

oauth:
  # Flujo de autorizacion oficial de Wallapop Connect.
  authorize_url: ""
  token_url: ""
  revoke_url: ""
  use_pkce: true
  scopes: []
  extra_authorize_params: {}

# ---------------------------------------------------------------------
# OPERACIONES
# ---------------------------------------------------------------------
# Formato de cada operacion:
#
#   nombre_operacion:
#     method: GET | POST | PUT | PATCH | DELETE
#     path: "/ruta/{item_id}"          # {item_id}, {conversation_id}... se sustituyen
#     query:  { limit: "{limit}" }     # parametros de URL
#     body:   { price: "{price}" }     # cuerpo JSON (solo metodos de escritura)
#     headers: {}
#     response:
#       collection_path: "data"        # ruta al array dentro de la respuesta
#       fields:                        # DTO de LOT Bot  <-  ruta en la respuesta
#         item_id: "id"
#         title: "title"
#     notes: "texto libre"
#
# Campos esperados por LOT Bot en cada DTO:
#   Item          -> item_id, title, description, price, currency, category,
#                    condition, status, views, favorites, images
#   Conversacion  -> conversation_id, buyer_name, item_id, subject, unread,
#                    last_message_at
#   Mensaje       -> message_id, conversation_id, direction, body, sent_at
#   Perfil        -> user_id, display_name, login, active_items
#   Mercado       -> title, price, currency, category
# ---------------------------------------------------------------------

operations:
  # ---- Cuenta ----
  account_profile:

  # ---- Anuncios: lectura ----
  list_items:
  get_item:
  search_items:

  # ---- Anuncios: escritura (requieren confirmacion del usuario) ----
  create_item:
  update_item:
  update_item_price:
  update_item_images:
  delete_item:
  upload_image:

  # ---- Categorias ----
  list_categories:

  # ---- Mensajeria ----
  list_conversations:
  get_conversation:
  send_message:

  # ---- Datos de mercado ----
  market_data:

